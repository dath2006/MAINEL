# ============================================
# MCMT-ReID Backend - Standalone Docker Compose
# ============================================
# For running the backend independently with GPU support
# Uses: PeopleNet + DeepSORT + Nvidia ReID pipeline
#
# Usage:
#   docker-compose up --build
#
# With env file:
#   docker-compose --env-file .env up --build

services:
  api:
    build: .
    container_name: mcmt-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:220066@db:5432/mcmt_reid
      - REDIS_URL=redis://redis:6379/0
      - OSRM_URL=http://localhost:5000
      - DEVICE=cuda
      - DEBUG=false
      # ML Models
      - PEOPLENET_MODEL_PATH=model_weights/resnet34_peoplenet.onnx
      - NVIDIA_REID_ONNX_PATH=model_weights/resnet50_market1501_aicity156.onnx
      - USE_NVIDIA_REID=true
      - USE_ONNX=true
      # Detection thresholds
      - YOLO_CONFIDENCE=0.5
      # ReID thresholds  
      - REID_MATCH_THRESHOLD=0.40
      - REID_NEW_THRESHOLD=0.50
      - REID_MERGE_THRESHOLD=0.6
      # Quality thresholds
      - GALLERY_QUALITY_THRESHOLD=55.0
      - SEARCH_THRESHOLD=0.5
      # Tracking
      - DEEPSORT_MAX_AGE=10
      - DEEPSORT_N_INIT=1
      # Spatial-Temporal
      - ST_WEIGHT=0.5
      - MAX_TRANSITION_TIME=300.0
    volumes:
      - ./model_weights:/app/model_weights
      - ./uploads:/app/uploads
      - ./video_library:/app/video_library
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: mcmt-db
    environment:
      - POSTGRES_DB=mcmt_reid
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=220066
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcmt_reid"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mcmt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
