services:
  # ============================================
  # Backend - FastAPI with ML Pipeline
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mcmt-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mcmt:mcmt_password@db:5432/mcmt_reid
      - REDIS_URL=redis://redis:6379/0
      - OSRM_URL=http://osrm:5000
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    volumes:
      # Mount source code for hot-reloading
      - ./backend/app:/app/app:cached
      - ./backend/alembic:/app/alembic:cached
      - ./backend/alembic.ini:/app/alembic.ini:cached
      # Mount requirements.txt for dynamic package installation
      - ./backend/requirements.txt:/app/requirements.txt:cached
      # Persist model weights
      - ./backend/model_weights:/app/model_weights
      # Persist uploads
      - ./backend/uploads:/app/uploads
      # Mount videos folder (customize this path to your video location)
      - ${VIDEO_PATH:-./videos}:/app/videos
      # Named volume for pip cache
      - backend_pip_cache:/root/.cache/pip
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - mcmt-network

  # ============================================
  # Frontend - Next.js
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mcmt-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot-reloading
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/next.config.ts:/app/next.config.ts:cached
      - ./frontend/tsconfig.json:/app/tsconfig.json:cached
      - ./frontend/package.json:/app/package.json:cached
      - ./frontend/components.json:/app/components.json:cached
      # Named volume for node_modules (avoids OS-specific issues)
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - mcmt-network

  # ============================================
  # PostgreSQL with PostGIS
  # ============================================
  db:
    image: postgis/postgis:15-3.3
    container_name: mcmt-db
    environment:
      - POSTGRES_DB=mcmt_reid
      - POSTGRES_USER=mcmt
      - POSTGRES_PASSWORD=mcmt_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcmt -d mcmt_reid"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mcmt-network

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: mcmt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mcmt-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  redis_data:
  backend_pip_cache:
  frontend_node_modules:

# ============================================
# Networks
# ============================================
networks:
  mcmt-network:
    driver: bridge
